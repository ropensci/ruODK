# TLS terminator + reverse proxy for the ODK Central test stack (issue #170).
#
# Why this exists: ODK Central refuses HTTP Basic auth over plain HTTP
# (getodk/central-backend lib/http/preprocessors.js -> Problem.user.httpsOnly)
# and ruODK authenticates with httr::authenticate() -> Basic. The test API is
# therefore served over TLS using the self-signed cert from gen-certs.sh, and
# R trusts it via CURL_CA_BUNDLE=.../odkc/certs/ca.crt.
#
# `proxy_set_header X-Forwarded-Proto $scheme` is the ordinary reverse-proxy
# contract -- see getodk/central files/nginx/odk.conf.template, which does the
# same. $scheme is "https" here because we listen on ssl.
#
# Slimmed from that template: no frontend, no enketo, no CSP -- just the /v1
# backend and a credential-free /healthz for the container healthcheck.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  access_log off;
  server_tokens off;

  # Matches getodk/central files/nginx/odk.conf.template: submissions carry
  # media attachments.
  client_max_body_size 100m;

  server {
    listen 8383 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Answered by nginx itself so the healthcheck needs no backend credentials
    # (the backend answers 401.2 unauthenticated).
    location = /healthz {
      add_header Content-Type text/plain;
      add_header X-Content-Type-Options nosniff always;
      return 200 'ok';
    }

    location / {
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_pass http://service:8383;
      proxy_redirect off;
      proxy_read_timeout 2m;
    }
  }
}
