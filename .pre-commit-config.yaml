exclude: "/migrations/|^venv/|/email/subject/"
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Drop trailing whitespace
        exclude: man
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-toml
        name: Check TOML syntax
      # - id: pretty-format-json
      #   name: Format JSON
      - id: check-added-large-files
        name: Prevent adding large files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
        name: Check for unhandled merge conflicts
      - id: debug-statements
        name: Check for debug statements
      - id: detect-private-key
        name: Detect private keys

  # Posit air R formatter (https://posit-dev.github.io/air/).
  # Local hook so no extra hook repo is fetched; requires `air` on PATH.
  - repo: local
    hooks:
      - id: air-format
        name: Format R code with air
        entry: air format
        language: system
        types: [r]
