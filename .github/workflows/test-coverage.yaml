# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Measures coverage against a local ODK Central in Docker, so no hosted test
# server and no ODKC_* secrets are needed. See issue #170.
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    environment: ci
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

      # Target the ODK Central that the steps below start. These credentials
      # are throwaway values for a loopback-only container. They are not
      # secrets, and they are not the ruodk.getodk.cloud credentials.
      ODKC_TEST_URL: https://localhost:8383
      ODKC_SEED_URL: https://localhost:8383
      ODKC_TEST_UN: ruodk@example.com
      ODKC_TEST_PW: ruodk-local-password
      ODKC_TEST_PP: ThePassphrase

      # Project and form ids. They come from inst/extdata/odkc/manifest.json
      # and match CONTRIBUTING.md.
      ODKC_TEST_PID: 1
      ODKC_TEST_PID_ENC: 2
      ODKC_TEST_FID: Flora-Quadrat-04
      ODKC_TEST_FID_ZIP: Locations
      ODKC_TEST_FID_ATT: Flora-Quadrat-04-att
      ODKC_TEST_FID_GAP: Flora-Quadrat-04-gap
      ODKC_TEST_FID_WKT: Locations
      ODKC_TEST_FID_ENC: Locations
      ODKC_TEST_FID_I8N0: I8n_no_lang
      ODKC_TEST_FID_I8N1: I8n_label_lng
      ODKC_TEST_FID_I8N2: I8n_label_choices
      ODKC_TEST_FID_I8N3: I8n_no_lang_choicefilter
      ODKC_TEST_FID_I8N4: I8n_lang_choicefilter

      # Version of the ODK Central image that .devcontainer/.env pins.
      ODKC_TEST_VERSION: 2026.3.0
      ODKC_VERSION: 2026.3.0

      # RU_VERBOSE must be TRUE for ru_msg_warn() to emit anything. It returns
      # NULL silently when FALSE (R/ru_msg.R), and several tests use
      # expect_warning().
      RU_VERBOSE: TRUE
      RU_TIMEZONE: Australia/Perth
      RU_RETRIES: 3

    steps:
      - uses: actions/checkout@v4

      - name: Start ODK Central
        run: |
          docker compose --env-file .devcontainer/.env \
            -f .devcontainer/docker-compose.yml up -d --wait

      - name: Trust the local TLS CA
        # The stack uses a self-signed certificate. Point libcurl at a bundle
        # that holds the system CAs and the local CA. Do not use the local CA
        # alone: that replaces the system bundle and breaks other https calls.
        run: |
          bundle=".devcontainer/odkc/certs/ca-bundle.pem"
          .devcontainer/odkc/ca-bundle.sh "$bundle" > /dev/null
          echo "CURL_CA_BUNDLE=$GITHUB_WORKSPACE/$bundle" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      # After setup-r-dependencies: seed_odkc.R is Rscript and needs the
      # packages it library()s (httr, jsonlite, purrr, fs, xml2).
      - name: Seed ODK Central
        run: Rscript data-raw/seed_odkc.R

      - name: Test coverage
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: ODK Central logs
        if: failure()
        run: |
          docker compose --env-file .devcontainer/.env \
            -f .devcontainer/docker-compose.yml logs --no-log-prefix service nginx

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
